name: Continuous Delivery

on: push

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # The tests run in Vitest browser mode, in Playwright's Chromium, WebKit and Firefox.
      - run: npx playwright install --with-deps --only-shell chromium webkit firefox
      - run: npm run verify
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage
          path: coverage/
      # Type-checking no longer emits, so build here to catch diagnostics that only
      # surface during declaration emit (e.g. private names in exported API).
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    name: publish package if needed
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx --yes semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
